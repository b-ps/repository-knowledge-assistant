[project]
name = "repository-knowledge-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "b-ps", email = "blancaps.17.11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=9.5.0",
    "gitpython>=3.1.59",
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "openai>=2.53.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
]

[project.scripts]
repository-knowledge-assistant = "repository_knowledge_assistant:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
